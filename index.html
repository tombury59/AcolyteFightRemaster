<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Acolyte Fight! - skillshot arena</title>
		<meta name="description" content="One-minute spellcaster arena. Shoot fireballs, swing your lightsaber, dodge meteors in a fast-paced skill-based arena." />
		<link rel="apple-touch-icon" sizes="180x180" href="/icons/favicon-180.png">
		<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
		<link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png">
		<meta name="theme-color" content="#00ccff">
		<link rel="manifest" href="/manifest.webmanifest" />
		<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0"/>
		<meta name="apple-mobile-web-app-capable" content="yes">
		<meta name="mobile-web-app-capable" content="yes">
		<style>
			body {
				background: #111;
			}

			.loading-splash {
				position: absolute;
				bottom: 0;
				left: 0;
				margin: 1em;

				animation: loading-splash-animation 2s linear alternate both infinite;
			}

			@keyframes loading-splash-animation {
				from { color: #444 }
				to { color: #666 }
			}
		</style>
		<link href="/cdn/fontawesome-pro-5.10.1-web/css/all.css" rel="stylesheet">
		<style>
			@font-face {
				font-family: 'ChicagoFLF';
				src: url("/cdn/fonts/ChicagoFLF.ttf") format('truetype');
				font-weight: normal;
				font-style: normal;
			}
			@font-face {
				font-family: 'Maven Pro';
				src: url("/cdn/fonts/MavenPro-Regular.ttf") format('truetype');
				font-weight: normal;
				font-style: normal;
			}
			@font-face {
				font-family: 'Maven Pro';
				src: url("/cdn/fonts/MavenPro-Bold.ttf") format('truetype');
				font-weight: bold;
				font-style: normal;
			}
		</style>
	</head>
	<body class="game">
		<div id="root">
			<div class="loading-splash">Loading...</div>
		</div>
		<script type="module" src="/src/client/index.tsx"></script>
	</body>
</html>
